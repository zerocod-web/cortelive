name: Verificar Segredos

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (historico e arvore)
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio com historico completo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Instalar Gitleaks oficial com verificacao SHA-256 e varrer segredos
        shell: bash
        run: |
          set -euo pipefail
          VERSAO="8.30.1"
          ARQUIVO="gitleaks_${VERSAO}_linux_x64.tar.gz"
          SHA256_ESPERADO="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          curl -fsSL --retry 3 -o "/tmp/${ARQUIVO}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSAO}/${ARQUIVO}"
          echo "${SHA256_ESPERADO}  /tmp/${ARQUIVO}" | sha256sum -c -
          tar -xzf "/tmp/${ARQUIVO}" -C /tmp gitleaks
          chmod +x /tmp/gitleaks
          /tmp/gitleaks git . --redact --verbose
          /tmp/gitleaks dir . --redact --verbose
