# Configuracao de postagem do CorteLive (EXEMPLO — sem nenhum segredo no repositorio!).
# Para usar:
#   1. Copie este arquivo para %LOCALAPPDATA%\CorteLive\postar.toml
#   2. Escolha o provedor padrao ("direto" ou "postiz") e preencha apenas os IDs publicos
#      conforme o guia em LEIA-ME_POSTAGEM.md.
#   3. O modo "postar ao cortar" fica a cargo do modulo cortelive.autopost.

# Provedor padrao quando --via nao e informado na CLI ("direto" ou "postiz")
provedor_padrao = "direto"
privado_padrao = false

# Retentativa automatica e backoff quando a internet oscila ou a API pede espera
tentativas_max = 3
backoff_inicial_s = 2.0
backoff_fator = 2.0
backoff_max_s = 60.0
chunk_mb = 8

# Servidor local temporario (loopback) para receber o retorno do login OAuth no navegador
porta_oauth = 8765
timeout_oauth_s = 180

[servidor_tokens]
# Cloudflare Worker intermediario (veja cortelive\postar\servidor_tokens\README.md).
# Guarda os segredos de Meta (Instagram) e TikTok fora do PC dos amigos.
url = "https://SEU-WORKER.SEU-SUBDOMINIO.workers.dev"

[youtube]
# Cliente OAuth tipo "App para computador (Desktop app)" com PKCE S256.
# O Google trata o Desktop app como cliente publico/nao confidencial, mas nada real vai ao repo.
client_id = "SEU_CLIENT_ID_GOOGLE.apps.googleusercontent.com"
redirect_uri = "http://127.0.0.1:8765/callback"
categoria_id = "20"              # 20 = Gaming, 22 = Pessoas e blogs
limite_24h = 6                   # Cota padrao Google Cloud (10.000 unid / 1.600 por upload = 6/dia)
intervalo_min_s = 30
forcar_privado = false

[instagram]
# App da Meta (Facebook Login for Business + Instagram Graph API).
# Apenas o ID publico do App fica aqui; o segredo mora SOMENTE no servidor_tokens!
client_id = "SEU_APP_ID_META"
redirect_uri = "http://127.0.0.1:8765/callback"
versao_api = "v21.0"
limite_24h = 25                  # Limite seguro da Graph API para Reels em 24h
intervalo_min_s = 30
poll_intervalo_s = 3.0
poll_tentativas = 40
ig_user_id = ""

[tiktok]
# App do TikTok for Developers (Login Kit + Content Posting API).
# Apenas o Client Key publico fica aqui; o segredo mora SOMENTE no servidor_tokens!
client_key = "SEU_CLIENT_KEY_TIKTOK"
redirect_uri = "http://127.0.0.1:8765/callback"
limite_24h = 15                  # Limite diario seguro do Content Posting API por criador
intervalo_min_s = 30
poll_intervalo_s = 3.0
poll_tentativas = 40
forcar_privado = false

[postiz]
# Alternativa com --via postiz (API Key colada via `conectar postiz` e salva com DPAPI no cofre).
base_url = "https://api.postiz.com/public/v1"
ajustar_midia = false
poll_intervalo_s = 2.0
poll_tentativas = 30
tiktok_metodo = "DIRECT_POST"
# Opcional: fixar ID de integracao especifica caso tenha mais de um canal da mesma rede no Postiz
integracao_youtube = ""
integracao_instagram = ""
integracao_tiktok = ""
