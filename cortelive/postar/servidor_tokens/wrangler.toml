# Exemplo de configuracao do Cloudflare Worker para troca/renovacao de tokens OAuth.
# NUNCA coloque segredos aqui! Os segredos entram apenas via `npx wrangler secret put`:
#   npx wrangler secret put META_APP_SECRET
#   npx wrangler secret put TIKTOK_CLIENT_SECRET
#   npx wrangler secret put YOUTUBE_CLIENT_SECRET   # opcional

name = "cortelive-servidor-tokens"
main = "worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

[vars]
VERSAO_META_API = "v21.0"
# Opcional: fixar os IDs publicos para o Worker rejeitar pedidos de outros apps:
# META_APP_ID = "SEU_APP_ID_META"
# TIKTOK_CLIENT_KEY = "SEU_CLIENT_KEY_TIKTOK"
# YOUTUBE_CLIENT_ID = "SEU_CLIENT_ID_GOOGLE.apps.googleusercontent.com"
